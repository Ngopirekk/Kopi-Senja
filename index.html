<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopi Senja — Pesan di Meja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700&family=Pacifico&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<!-- Google Identity Services (Sign In With Google) — resmi dari Google, dipakai untuk login Google asli -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Pembuat QR Code (untuk QR pesanan pembeli) & pembaca QR Code lewat kamera (untuk halaman Kasir) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<!-- Firebase (Realtime Database) — dipakai supaya data pesanan tersinkron NYATA
     antar perangkat berbeda (HP pembeli vs HP/tablet kasir), sesuatu yang TIDAK
     bisa dilakukan localStorage/BroadcastChannel saja (itu cuma jalan dalam satu
     browser/perangkat yang sama). Lihat blok inisialisasi Firebase di bagian
     <script> utama untuk detail & fallback kalau internet/Firebase tidak tersedia. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --cream:#F6ECDA;
    --paper:#FFFBF3;
    --espresso:#2B1B12;
    --espresso-2:#4A3324;
    --amber:#C17A3E;
    --amber-light:#E7C393;
    --cherry:#9C2B3D;
    --sage:#6E7B58;
    --line:#E6D6B8;
    --muted:#8A7A63;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(193,122,62,0.10) 0, transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(156,43,61,0.08) 0, transparent 45%),
      var(--cream);
    font-family:'Work Sans', sans-serif;
    color:var(--espresso);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 12px;
  }
  .app{
    width:100%;
    max-width:428px;
    background:var(--paper);
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(43,27,18,0.35), 0 0 0 1px rgba(43,27,18,0.06);
    position:relative;
    height:800px;
    max-height:88vh;
    display:flex;
    flex-direction:column;
  }
  @media (max-width:480px){
    body{ padding:0; min-height:100dvh; }
    .app{
      max-width:100%;
      width:100%;
      height:100dvh;
      max-height:100dvh;
      border-radius:0;
      box-shadow:none;
    }
  }
  #viewMenu{
    flex:1;
    min-height:0;
    overflow-y:auto;
  }
  ::-webkit-scrollbar{display:none;}
  * { scrollbar-width:none; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(circle at 15% 20%, rgba(231,195,147,0.18) 0, transparent 40%),
      linear-gradient(155deg, #3A2416 0%, var(--espresso) 55%, #1C1108 100%);
    padding:16px 16px 22px;
    color:var(--cream);
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(246,236,218,0.07) 1.4px, transparent 1.4px);
    background-size:16px 16px;
    pointer-events:none;
  }
  .hero-top{display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    background:rgba(246,236,218,0.12);
    border:1px solid rgba(246,236,218,0.18);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    font-size:14px; cursor:pointer;
  }
  .hero-actions{display:flex; gap:8px;}
  .hero-brand{
    text-align:center; padding:14px 0 4px; position:relative; z-index:2;
  }
  .cup-wrap{position:relative; display:inline-block; margin-bottom:4px;}
  .cup-emoji{font-size:46px; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35));}
  .steam span{
    position:absolute; bottom:40px; width:3px; height:14px;
    background:rgba(246,236,218,0.55);
    border-radius:3px;
    animation:steamRise 2.4s ease-in-out infinite;
    opacity:0;
  }
  .steam span:nth-child(1){left:14px; animation-delay:0s;}
  .steam span:nth-child(2){left:23px; animation-delay:.6s;}
  .steam span:nth-child(3){left:32px; animation-delay:1.2s;}
  @keyframes steamRise{
    0%{ transform:translateY(0) scaleY(0.6); opacity:0; }
    30%{ opacity:.7; }
    100%{ transform:translateY(-22px) scaleY(1.3); opacity:0; }
  }
  .hero-brand h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:30px;
    margin:2px 0 2px;
    letter-spacing:0.3px;
    background:linear-gradient(90deg, var(--amber-light), #fff6e6 55%, var(--amber-light));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-brand p{
    margin:0; font-size:12.5px; color:rgba(246,236,218,0.68); letter-spacing:0.4px;
  }
  .bean-row{
    text-align:center; margin-top:14px; font-size:15px; letter-spacing:10px;
    opacity:0.55; position:relative; z-index:2;
  }

  /* ---------- INFO CARD ---------- */
  .info-card{
    margin:-16px 14px 0;
    background:var(--paper);
    border-radius:14px;
    padding:13px 14px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 10px 24px -14px rgba(43,27,18,0.5);
    position:relative; z-index:3;
  }
  .info-card .name{display:block; font-weight:600; font-size:14.5px;}
  .info-card .hours{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
  .info-card .hours::before{content:"● "; color:var(--sage); font-size:9px;}
  .chev{color:var(--muted); font-size:18px;}

  .table-chip{
    margin:12px 16px 0;
    background:linear-gradient(90deg, rgba(193,122,62,0.14), rgba(156,43,61,0.10));
    border:1px solid var(--line);
    color:var(--espresso-2);
    font-size:12.5px;
    padding:9px 12px;
    border-radius:10px;
    text-align:center;
    font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .table-chip b{ font-family:'JetBrains Mono', monospace; color:var(--cherry); }
  .edit-table-btn{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--amber);
    background:#fff; color:var(--cherry); font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none; padding:0;
  }
  .table-chip input{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; font-weight:700; color:var(--cherry);
    border:1px solid var(--amber); border-radius:6px; padding:4px 8px; width:80px; text-align:center;
    background:#fff;
  }

  /* ---------- TABS ---------- */
  .tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding:16px 16px 10px;
    position:sticky; top:0; background:var(--paper); z-index:5;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:none; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:#fff;
    font-size:12.5px; font-weight:600; color:var(--muted);
    cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--espresso); color:var(--amber-light); border-color:var(--espresso); }

  /* ---------- MENU ---------- */
  .menu{ padding:6px 16px 110px; }
  .section-title{
    font-family:'Fraunces', serif;
    font-size:18px; font-weight:600;
    margin:22px 0 12px;
    display:flex; align-items:baseline; gap:8px;
  }
  .section-title small{
    font-family:'Work Sans', sans-serif; font-weight:500; font-size:11px; color:var(--muted);
  }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    cursor:pointer; display:flex; flex-direction:column;
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(0.97); }
  .thumb{
    height:92px; display:flex; align-items:center; justify-content:center; font-size:30px;
    touch-action:manipulation; position:relative;
  }
  .thumb.has-photo{ background-size:cover; background-position:center; }
  .thumb.is-sold-out{ filter:grayscale(65%) brightness(0.8); }
  .sold-out-badge{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(20,12,7,0.5); color:#fff; font-weight:800; font-size:11px;
    letter-spacing:0.5px; text-transform:uppercase; border-radius:inherit;
  }
  .g1{ background:linear-gradient(135deg,#EFD8AE,#C17A3E); }
  .g2{ background:linear-gradient(135deg,#D9B48F,#9C2B3D); }
  .g3{ background:linear-gradient(135deg,#CBD3B4,#6E7B58); }
  .card-body{ padding:10px 10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-body .nm{ font-weight:600; font-size:13px; line-height:1.25; }
  .card-body .ds{ font-size:11px; color:var(--muted); line-height:1.35; min-height:28px; }
  .price-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .price{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px; color:var(--espresso-2); }
  .add-btn{
    border:1.5px solid var(--cherry); color:var(--cherry); background:#fff;
    font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:8px; cursor:pointer;
  }
  .add-btn:active{ background:var(--cherry); color:#fff; }
  .add-btn:disabled{
    border-color:var(--line); color:var(--muted); background:#F2ECE2; cursor:default;
  }
  .add-btn:disabled:active{ background:#F2ECE2; color:var(--muted); }

  .list-row{
    display:flex; gap:12px; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .list-row .thumb{ width:60px; height:60px; border-radius:12px; flex:none; font-size:22px; }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .nm{ font-weight:600; font-size:13.5px; }
  .list-row .ds{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .list-row .price-row{ margin-top:6px; }

  /* ---------- CART BAR ---------- */
  .cart-bar{
    position:absolute; left:14px; right:14px; bottom:16px;
    background:var(--cherry); color:#fff; border:none; border-radius:14px;
    display:flex; align-items:center; gap:10px; padding:11px 14px;
    box-shadow:0 14px 30px -10px rgba(156,43,61,0.65);
    cursor:pointer; z-index:20;
  }
  .basket{
    position:relative; font-size:19px; background:none; border:none; padding:4px;
    margin:-4px; border-radius:10px; cursor:pointer; color:inherit; line-height:1;
  }
  .basket:active{ background:rgba(255,255,255,0.18); }
  .badge{
    position:absolute; top:-8px; right:-10px; background:var(--cream); color:var(--cherry);
    font-size:10px; font-weight:800; border-radius:50%; width:17px; height:17px;
    display:flex; align-items:center; justify-content:center;
  }
  .cart-total{ display:flex; flex-direction:column; align-items:flex-start; margin-right:auto; }
  .cart-total small{ font-size:9.5px; opacity:0.8; }
  .cart-total b{ font-family:'JetBrains Mono', monospace; font-size:13px; }
  .checkout-label{ font-size:12.5px; font-weight:700; }

  /* ---------- SHEET / MODAL ---------- */
  .sheet-overlay{
    position:absolute; inset:0; background:rgba(20,12,7,0.55); z-index:40;
    display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--paper); width:100%; max-height:88%; border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; animation:slideUp .25s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-hero{
    height:140px; flex:none; display:flex; align-items:center; justify-content:center; font-size:52px;
    position:relative; touch-action:manipulation;
  }
  .sheet-hero.has-photo{ background-size:cover; background-position:center; }
  .sheet-hero .close{
    position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.85); border:none; font-size:14px; cursor:pointer;
  }
  .sheet-scroll{ overflow-y:auto; padding:16px 18px 0; }
  .sheet-scroll h2{ font-family:'Fraunces', serif; font-size:19px; margin:0 0 4px; }
  .sheet-scroll .sprice{ font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--cherry); font-size:14.5px; }
  .sheet-scroll .sdesc{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }

  .mini-cart-sheet{ max-height:80%; }
  .mini-cart-head{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 8px; font-family:'Fraunces', serif; font-weight:600; font-size:16px;
  }
  .mini-cart-head .close{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--cream);
    font-size:14px; cursor:pointer; color:var(--espresso);
  }
  .mini-cart-scroll{ padding-top:4px; padding-bottom:6px; }
  .mini-cart-empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:30px 10px; }

  .group{ margin-top:20px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .group-head{ display:flex; align-items:center; justify-content:space-between; }
  .group-head .t{ font-weight:700; font-size:13.5px; }
  .group-head .n{ display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:1px; }
  .status-dot{
    width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent; flex:none;
  }
  .status-dot.ok{ background:var(--sage); border-color:var(--sage); color:#fff; }

  .opt-radio{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0 0; cursor:pointer;
  }
  .opt-radio .oc{
    width:18px; height:18px; border-radius:50%; border:1.5px solid var(--muted);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .opt-radio.sel .oc{ border-color:var(--cherry); background:var(--cherry); }
  .opt-radio.sel .oc::after{ content:""; width:7px; height:7px; border-radius:50%; background:#fff; }
  .opt-radio .ol{ flex:1; margin:0 10px; font-size:13px; }
  .opt-radio .oe{ font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono', monospace; }

  .opt-stepper{ display:flex; align-items:center; justify-content:space-between; padding:10px 0 0; }
  .opt-stepper .ol{ font-size:13px; }
  .opt-stepper .oe{ display:block; font-size:11px; color:var(--muted); font-family:'JetBrains Mono', monospace; margin-top:2px;}
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    font-size:14px; cursor:pointer; color:var(--espresso);
  }
  .stepper button:disabled{ opacity:0.3; cursor:default; }
  .stepper .qv{ min-width:14px; text-align:center; font-weight:700; font-size:13px; }

  .notes-block{ margin:20px 0; }
  .notes-block .t{ font-weight:700; font-size:13.5px; }
  .notes-block textarea{
    width:100%; margin-top:8px; border:1.5px solid var(--line); border-radius:10px; padding:10px;
    font-family:'Work Sans', sans-serif; font-size:12.5px; resize:none; min-height:56px;
  }

  .sheet-footer{
    flex:none; padding:12px 18px 18px; border-top:1px solid var(--line); background:var(--paper);
  }
  .total-order-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .total-order-row .t{ font-weight:600; font-size:13px; }
  .cta{
    width:100%; border:none; border-radius:12px; background:var(--cherry); color:#fff;
    padding:13px; font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; padding-inline:16px;
  }
  .cta:disabled{ background:#D8CDBC; color:#fff; cursor:not-allowed; }
  .cta .amt{ font-family:'JetBrains Mono', monospace; }

  /* ---------- CHECKOUT / SUCCESS VIEWS ---------- */
  .view-page{ position:absolute; inset:0; background:var(--paper); z-index:30; display:flex; flex-direction:column; }
  .page-top{ display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--line); flex:none; }
  .page-top button{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--espresso); }
  .page-top h3{ font-family:'Fraunces', serif; margin:0; font-size:16.5px; }
  .page-top .role-switch{ margin-left:auto; margin-right:8px; }
  .page-top .role-switch .role-link-top{
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; align-items:center; gap:4px;
    font-family:'Work Sans', sans-serif; font-weight:700; font-size:12.5px; color:var(--cherry);
  }
  .page-body{ flex:1; overflow-y:auto; padding:18px 18px 20px; }

  .search-input-wrap{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--cream); border:1.5px solid var(--line); border-radius:11px; padding:9px 12px;
  }
  .search-input-wrap .search-ic{ font-size:14px; flex:none; }
  .search-input-wrap input{
    flex:1; border:none; background:transparent; outline:none; font-size:13.5px;
    font-family:'Work Sans', sans-serif; color:var(--espresso); min-width:0;
  }
  .search-input-wrap input::placeholder{ color:var(--muted); }
  .clear-search-btn{
    flex:none; width:20px; height:20px; border-radius:50%; border:none;
    background:var(--line); color:var(--espresso-2); font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .search-hint{ text-align:center; color:var(--muted); font-size:12.5px; padding:40px 20px; line-height:1.6; }
  .search-empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:40px 20px; line-height:1.6; }
  .search-count{ font-size:11px; color:var(--muted); font-weight:600; margin-bottom:12px; }
  .search-results-list .list-row:last-child{ border-bottom:none; }
  .search-results-list mark{ background:rgba(193,122,62,0.30); color:inherit; border-radius:3px; padding:0 1px; }

  /* ---------- PROFILE ---------- */
  .profile-card{
    display:flex; align-items:center; gap:14px; padding:16px;
    background:var(--cream); border-radius:14px; margin-bottom:22px;
  }
  .profile-avatar{
    width:56px; height:56px; border-radius:50%; background:#fff; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:26px; flex:none;
    position:relative; overflow:hidden; cursor:pointer; background-size:cover; background-position:center;
  }
  .profile-avatar .avatar-edit-badge{
    position:absolute; right:-2px; bottom:-2px; width:19px; height:19px; border-radius:50%;
    background:var(--cherry); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--paper);
  }
  .profile-avatar .avatar-delete-badge{
    position:absolute; left:-2px; bottom:-2px; width:19px; height:19px; border-radius:50%;
    background:var(--espresso); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--paper); cursor:pointer;
  }

  /* ---------- PHOTO VIEWER (lihat foto asli menu secara utuh) ---------- */
  .photo-view-overlay{
    position:absolute; inset:0; z-index:200; background:rgba(20,12,7,0.94);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    padding:20px;
  }
  .photo-view-overlay img{
    max-width:100%; max-height:75vh; width:auto; height:auto; object-fit:contain;
    border-radius:16px; box-shadow:0 20px 40px -10px rgba(0,0,0,0.6); background:#fff;
  }
  .photo-view-overlay .pv-name{ color:var(--amber-light); font-family:'Fraunces', serif; font-size:16px; text-align:center; }
  .photo-view-overlay .pv-close{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    background:rgba(246,236,218,0.14); border:1px solid rgba(246,236,218,0.25); color:var(--cream);
    font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .photo-view-overlay .pv-hint{ color:rgba(246,236,218,0.55); font-size:11.5px; }
  .role-switch{ display:flex; gap:8px; margin:14px 0 18px; }
  .role-btn{
    flex:1; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px;
    padding:9px 8px; border-radius:11px; border:1.5px solid var(--line); background:#fff;
